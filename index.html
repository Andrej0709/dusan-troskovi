<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<title>Troškovi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header + tab bar, one centered work column; each tab is a grid of panels that collapses to one column on phones. */
:root {
  --bg: #F0F0F0;
  --surface: #FFFFFF;
  --surface-2: #F5F5F5;
  --line: #E0E0E0;
  --ink: #0A0A0A;
  --ink-2: #4A4A4A;
  --muted: #7A7A7A;
  --accent: #0A0A0A;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8E8E8;
  --good: #1D8556;
  --good-soft: #DDF2E8;
  --warn: #A86A12;
  --warn-soft: #FBEFD9;
  --bad: #C13434;
  --bad-soft: #FBE3E3;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 6px 20px rgba(0, 0, 0, .05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0E0E0E; --surface-2: #181818; --line: #262626;
    --ink: #F2F2F2; --ink-2: #B5B5B5; --muted: #808080;
    --accent: #FFFFFF; --accent-ink: #000000; --accent-soft: #222222;
    --good: #4CC38A; --good-soft: #15332A; --warn: #E3AA4E; --warn-soft: #362A15;
    --bad: #F27474; --bad-soft: #3A1C1F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0E0E0E; --surface-2: #181818; --line: #262626;
  --ink: #F2F2F2; --ink-2: #B5B5B5; --muted: #808080;
  --accent: #FFFFFF; --accent-ink: #000000; --accent-soft: #222222;
  --good: #4CC38A; --good-soft: #15332A; --warn: #E3AA4E; --warn-soft: #362A15;
  --bad: #F27474; --bad-soft: #3A1C1F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 14px/1.5 var(--f-body);
  font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 12px 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 24px; font-weight: 800; }
.brand .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-row .spacer { flex: 1; }
.mode { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.mode i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.mode.db i, .mode.sb i { background: var(--good); }
.mode.local i { background: var(--warn); }

.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: transparent; padding: 7px 13px; border-radius: 999px;
  color: var(--ink-2); font-weight: 600; cursor: pointer; white-space: nowrap;
}
.tab:hover { background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* Buttons and inputs */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: var(--r-sm); font-weight: 600; cursor: pointer;
  white-space: nowrap; transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 7px; line-height: 0; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--r-sm); padding: 8px 10px; min-height: 38px;
}
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 64px; }

/* Panels */
main { padding-block: 20px 60px; }
.view { display: grid; gap: 16px; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px; min-width: 0; box-shadow: var(--shadow);
}
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head h2 { font-size: 17px; font-weight: 700; }
.panel-head .hint { color: var(--muted); font-size: 12.5px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }

.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; box-shadow: var(--shadow); }
.kpi.lead { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kpi.lead .eyebrow { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.kpi .val { font-family: var(--f-display); font-size: clamp(22px, 3.2vw, 30px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .val small { font-size: .5em; font-weight: 600; margin-left: 3px; opacity: .7; }
.kpi .meta { font-size: 12.5px; color: var(--muted); }
.kpi.lead .meta { color: color-mix(in srgb, var(--bg) 70%, transparent); }

.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 12px; padding: 1px 7px; border-radius: 999px; }
.delta.up { color: var(--bad); background: var(--bad-soft); }
.delta.down { color: var(--good); background: var(--good-soft); }
.delta.flat { color: var(--ink-2); background: var(--surface-2); }

/* Banners */
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r); border: 1px solid; }
.banner p { margin: 0; flex: 1; min-width: 220px; }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--ink); }
.banner.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

/* Category bars */
.bars { display: flex; flex-direction: column; gap: 11px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.bar-row .name { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.bar-row .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .amt { font-weight: 700; text-align: right; white-space: nowrap; }
.bar-row .amt em { font-style: normal; color: var(--muted); font-weight: 600; font-size: 12px; margin-left: 6px; }
.bar-track { grid-column: 1 / -1; height: 7px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.muted { background: var(--surface-2); color: var(--muted); }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 600 11px var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .total { fill: var(--ink-2); font-weight: 700; }
.chart .cur { fill: var(--ink); font-weight: 800; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Lists */
.mini-list { display: flex; flex-direction: column; }
.mini-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
.mini-item:last-child { border-bottom: 0; }
.mini-item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-item .s { grid-column: 1; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mini-item .a { grid-row: 1 / span 2; grid-column: 2; font-weight: 700; text-align: right; white-space: nowrap; }

/* Filter bar */
.filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; }
.filters .range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filters-2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 10px; }
.filters-2 .field { width: 150px; }
@media (max-width: 900px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .filters-2 .field { width: calc(50% - 5px); } }

.summary-line { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding: 12px 0 4px; color: var(--ink-2); }
.summary-line strong { color: var(--ink); font-family: var(--f-display); font-size: 18px; }

/* Expense table */
.tbl { display: flex; flex-direction: column; }
.tr { display: grid; grid-template-columns: 96px minmax(0, 2fr) minmax(0, 1.1fr) minmax(0, 1.1fr) 120px 36px; gap: 12px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--line); }
.tr.head { padding-block: 6px; border-bottom: 1px solid var(--line); }
.tr.head button { border: 0; background: none; padding: 4px 0; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); cursor: pointer; text-align: left; display: inline-flex; align-items: center; gap: 4px; }
.tr.head button.on { color: var(--ink); }
.tr.head .r, .tr .r { text-align: right; justify-content: flex-end; }
.tr.body { cursor: pointer; border-radius: 8px; }
.tr.body:hover { background: var(--surface-2); }
.tr .date { color: var(--ink-2); font-size: 13px; }
.tr .date b { display: block; color: var(--ink); font-weight: 700; font-size: 14px; }
.tr .title { min-width: 0; }
.tr .title div { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr .title small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.tr .amount { font-weight: 800; font-family: var(--f-display); font-size: 16px; text-align: right; white-space: nowrap; }
.tr .method { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-sep { font-size: 12px; font-weight: 700; color: var(--muted); padding: 14px 6px 4px; letter-spacing: .03em; display: flex; justify-content: space-between; }
@media (max-width: 760px) {
  .tr.head { display: none; }
  .tr { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 11px 4px; }
  .tr .date { display: none; }
  .tr .title { grid-column: 1; }
  .tr .amount { grid-column: 2; grid-row: 1; }
  .tr .cat, .tr .method { grid-row: 2; }
  .tr .cat { grid-column: 1; }
  .tr .method { grid-column: 2; text-align: right; }
  .tr .act { display: none; }
}

/* Subscriptions */
.subs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.sub-card { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); min-width: 0; }
.sub-card.off { opacity: .55; }
.sub-card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sub-card h3 { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-card .price { font-family: var(--f-display); font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.sub-card .price small { font-size: 13px; color: var(--muted); font-weight: 600; font-family: var(--f-body); }
.sub-card .next { font-size: 13px; color: var(--ink-2); }
.sub-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Recap */
.recap-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.period-nav { display: inline-flex; align-items: center; gap: 4px; }
.period-label { font-family: var(--f-display); font-weight: 700; font-size: 18px; min-width: 0; padding-inline: 6px; }
.story { font-size: 16px; line-height: 1.65; max-width: 68ch; margin: 0; color: var(--ink-2); }
.story b { color: var(--ink); }
.cmp { font-size: 12px; font-weight: 700; }
.cmp.up { color: var(--bad); }
.cmp.down { color: var(--good); }
.cmp.flat { color: var(--muted); }

/* Settings */
.set-list { display: flex; flex-direction: column; gap: 8px; }
.set-item { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.set-item.no-color { grid-template-columns: minmax(0, 1fr) auto auto; }
.set-item input[type="color"] { width: 38px; height: 38px; padding: 3px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; }
.set-item .count { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* Empty */
.empty { text-align: center; padding: 36px 16px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty h3 { font-size: 20px; color: var(--ink); }
.empty p { margin: 0; max-width: 44ch; }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 18px; padding: 0; width: min(520px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
.dlg { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.dlg h2 { font-size: 20px; }
.dlg .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 440px) { .dlg .two { grid-template-columns: 1fr; } }
.dlg .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.dlg .foot .left { margin-right: auto; }
.amount-input { font-family: var(--f-display); font-size: 26px !important; font-weight: 800; min-height: 52px !important; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px 5px 9px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.pick button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.err { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 0; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); display: flex; gap: 12px; align-items: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast button { background: transparent; border: 0; color: var(--accent-soft); font-weight: 700; cursor: pointer; text-decoration: underline; }

.loading { padding: 60px 16px; text-align: center; color: var(--muted); }

/* Filters collapse behind a toggle on phones */
.frow { display: flex; gap: 10px; align-items: end; margin-bottom: 10px; }
.frow .search { flex: 1; }
.f-toggle { display: none; }

/* Tab icons appear only in the phone bottom bar */
.tab-ico { display: none; }
.tab-ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Phone */
@media (max-width: 640px) {
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  .top-row { padding-block: 10px; }
  .brand h1 { font-size: 22px; }
  .brand .sub, .mode span { display: none; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px)); overflow: visible;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0; border-radius: 0; font-size: 11px; color: var(--muted); min-width: 0; }
  .tab > span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tab:hover, .tab[aria-selected="true"] { background: transparent; }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab-ico { display: grid; place-items: center; width: 48px; height: 28px; border-radius: 999px; transition: background .15s; }
  .tab[aria-selected="true"] .tab-ico { background: var(--ink); color: var(--bg); }
  main { padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .view { gap: 12px; }
  .panel { padding: 16px 14px; }
  .kpis { gap: 10px; }
  .kpi { padding: 12px 13px; }
  .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  /* 16px stops iOS from zooming into focused fields */
  .input, select.input, textarea.input { font-size: 16px; }
  .f-toggle { display: inline-flex; min-height: 44px; }
  .fpanel:not(.open) .adv { display: none; }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pick button { padding: 8px 13px 8px 11px; font-size: 14px; }
  dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 20px 20px 0 0; max-height: 92dvh; overflow: auto; border-bottom: 0; }
  .dlg { padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .dlg .foot .btn { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">

        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        Novi trošak

      <button class="tab" role="tab" data-tab="pregled"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5v-5.5H9V20H4z"/></svg></span><span>Pregled</span></button>
      <button class="tab" role="tab" data-tab="troskovi"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 6.5h12M8 12h12M8 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg></span><span>Troškovi</span></button>

      <button class="tab" role="tab" data-tab="recap"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg></span><span>Recap</span></button>
      <button class="tab" role="tab" data-tab="podesavanja"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 4.5v5M10 14.5v5"/></svg></span><span>Podešavanja</span></button>

<dialog id="dlg"></dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
"use strict";

/* ---------- Defaults ---------- */
const DEFAULT_CONFIG = {
  currency: "RSD",
  categories: [
    { id: "fudbal", name: "Fudbal", color: "#2E9E5B" },
    { id: "izlazak", name: "Izlazak", color: "#D9468F" },
    { id: "skola", name: "Škola", color: "#3B7DD8" },
    { id: "hrana", name: "Hrana", color: "#E0892E" },
    { id: "prevoz", name: "Prevoz", color: "#7C5CD6" },
    { id: "odeca", name: "Odeća", color: "#12A1A1" },
    { id: "pretplate", name: "Pretplate", color: "#C9A227" },
    { id: "ostalo", name: "Ostalo", color: "#8590A6" }
  ],
  methods: [
    { id: "gotovina", name: "Gotovina" },
    { id: "debitna", name: "Debitna kartica" },
    { id: "kreditna", name: "Kreditna kartica" },
    { id: "telefon", name: "Telefon (Pay)" },
    { id: "ips", name: "IPS / prenos" }
  ]
};
const CYCLES = { nedeljno: "nedeljno", mesecno: "mesečno", godisnje: "godišnje" };

/* ---------- State ---------- */
const S = {
  mode: "loading",
  expenses: [],
  subs: [],
  config: clone(DEFAULT_CONFIG),
  tab: "pregled",
  filters: { q: "", cat: "", method: "", period: "all", from: "", to: "", min: "", max: "" },
  sort: { key: "date", dir: "desc" },
  recap: { type: "week", offset: 0 },
  readOnly: false
};
try { const t = localStorage.getItem("troskovnik-tab"); if (t) S.tab = t; } catch (e) {}
try { const r = JSON.parse(localStorage.getItem("troskovnik-recap") || "null"); if (r && r.type) S.recap.type = r.type; } catch (e) {}

let DB = null, DL = null, SB = null;

/* ---------- Helpers ---------- */
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uid() {
  try { if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "").slice(0, 20); } catch (e) {}
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const NF = new Intl.NumberFormat("sr-RS", { maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat("sr-RS", { maximumFractionDigits: 0 });
function money(n, opts = {}) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  const s = (opts.round ? NF0 : NF).format(v);
  return opts.bare ? s : s + " " + S.config.currency;
}
function moneyHTML(n) { return `${NF0.format(Math.round(n || 0))}<small>${esc(S.config.currency)}</small>`; }
function pct(a, b) { if (!b) return null; return (a - b) / b * 100; }
function deltaHTML(cur, prev, label) {
  const p = pct(cur, prev);
  if (p === null) return prev === 0 && cur > 0 ? `<span class="delta up">novo</span>` : "";
  const cls = Math.abs(p) < 1 ? "flat" : p > 0 ? "up" : "down";
  const arrow = cls === "up" ? "▲" : cls === "down" ? "▼" : "•";
  return `<span class="delta ${cls}" title="${esc(label || "")}">${arrow} ${NF0.format(Math.abs(p))}%</span>`;
}

/* Dates (local, YYYY-MM-DD strings) */
const pad = n => String(n).padStart(2, "0");
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); }
function addMonths(s, n) {
  const d = parseD(s); const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last)); return ymd(d);
}
function weekStart(s) { const d = parseD(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return ymd(d); }
function monthStart(s) { return s.slice(0, 8) + "01"; }
function monthEnd(s) { const d = parseD(s); return ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function isoWeek(s) {
  const d = parseD(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7);
}
const LOC = "sr-Latn-RS";
const fmtMonth = s => cap(new Intl.DateTimeFormat(LOC, { month: "long", year: "numeric" }).format(parseD(s)).replace(/\.$/, ""));
const fmtMonthShort = s => new Intl.DateTimeFormat(LOC, { month: "short" }).format(parseD(s)).replace(/\.$/, "");
const fmtDay = s => new Intl.DateTimeFormat(LOC, { day: "numeric", month: "short" }).format(parseD(s));
const fmtDayLong = s => cap(new Intl.DateTimeFormat(LOC, { weekday: "long", day: "numeric", month: "long" }).format(parseD(s)));
const fmtWeekday = s => cap(new Intl.DateTimeFormat(LOC, { weekday: "short" }).format(parseD(s)).replace(/\.$/, ""));
const fmtWeekdayLong = s => new Intl.DateTimeFormat(LOC, { weekday: "long" }).format(parseD(s));
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function relDay(s) {
  const n = daysBetween(today(), s);
  if (n === 0) return "danas";
  if (n === 1) return "sutra";
  if (n === -1) return "juče";
  if (n > 0) return `za ${n} ${n % 10 === 1 && n % 100 !== 11 ? "dan" : "dana"}`;
  return `pre ${-n} ${(-n) % 10 === 1 && (-n) % 100 !== 11 ? "dan" : "dana"}`;
}

/* Lookups */
const catById = id => S.config.categories.find(c => c.id === id) || { id, name: "Bez kategorije", color: "#8590A6" };
const methodById = id => S.config.methods.find(m => m.id === id) || { id, name: id ? "Nepoznato" : "—" };
const sum = arr => arr.reduce((a, e) => a + (Number(e.amount) || 0), 0);
const inRange = (from, to) => e => e.date >= from && e.date <= to;
function groupSum(list, key) {
  const m = new Map();
  for (const e of list) m.set(e[key], (m.get(e[key]) || 0) + (Number(e.amount) || 0));
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function monthlyEq(s) {
  const a = Number(s.amount) || 0;
  return s.cycle === "nedeljno" ? a * 52 / 12 : s.cycle === "godisnje" ? a / 12 : a;
}
function nextAfter(date, cycle) {
  return cycle === "nedeljno" ? addDays(date, 7) : cycle === "godisnje" ? addMonths(date, 12) : addMonths(date, 1);
}

/* ---------- Persistence ---------- */
const LKEY = "troskovnik-v1";
function localSave() {
  try { localStorage.setItem(LKEY, JSON.stringify({ expenses: S.expenses, subs: S.subs, config: S.config })); } catch (e) {}
}
function localRead() {
  try { const raw = localStorage.getItem(LKEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function localLoad() {
  const d = localRead();
  if (d) { S.expenses = d.expenses || []; S.subs = d.subs || []; if (d.config) S.config = d.config; }
}

/* Supabase rows use snake_case columns; the app uses camelCase objects */
const SBCFG = window.TROSKOVNIK_CONFIG || {};
function sbConfigured() {
  return !!(SBCFG.supabaseUrl && SBCFG.supabaseAnonKey && window.supabase && typeof window.supabase.createClient === "function");
}
const toRowE = e => ({ id: e.id, title: e.title || "", amount: Number(e.amount) || 0, date: e.date, category: e.category || "", method: e.method || "", note: e.note || "", sub_id: e.subId || null, example: !!e.example, created_at: e.createdAt || Date.now() });
function fromRowE(r) {
  const e = { id: r.id, title: r.title || "", amount: Number(r.amount) || 0, date: r.date, category: r.category || "", method: r.method || "", note: r.note || "", createdAt: Number(r.created_at) || 0 };
  if (r.sub_id) e.subId = r.sub_id;
  if (r.example) e.example = true;
  return e;
}
const toRowS = s => ({ id: s.id, name: s.name, amount: Number(s.amount) || 0, cycle: s.cycle || "mesecno", next_date: s.nextDate || null, category: s.category || "", method: s.method || "", active: s.active !== false, example: !!s.example, created_at: s.createdAt || Date.now() });
function fromRowS(r) {
  const s = { id: r.id, name: r.name, amount: Number(r.amount) || 0, cycle: r.cycle || "mesecno", nextDate: r.next_date || "", category: r.category || "", method: r.method || "", active: r.active !== false, createdAt: Number(r.created_at) || 0 };
  if (r.example) s.example = true;
  return s;
}
async function sbRun(q) { const { data, error } = await q; if (error) throw error; return data; }
async function sbFetchAll(table) {
  const out = [], page = 1000;
  for (let from = 0; ; from += page) {
    const rows = await sbRun(SB.from(table).select("*").range(from, from + page - 1));
    out.push(...rows);
    if (rows.length < page) return out;
  }
}
async function sbLoadAll() {
  const [ex, sx, cfg] = await Promise.all([
    sbFetchAll("expenses"),
    sbFetchAll("subs"),
    sbRun(SB.from("config").select("data").eq("id", "main").maybeSingle())
  ]);
  S.expenses = ex.map(fromRowE);
  S.subs = sx.map(fromRowS);
  if (cfg && cfg.data && Object.keys(cfg.data).length) S.config = { ...clone(DEFAULT_CONFIG), ...cfg.data };
}
function sbFailed(err) {
  console.error(err);
  toast("Čuvanje u bazu nije uspelo" + (err && err.message ? ": " + err.message : ". Proveri internet i pokušaj ponovo."));
}
function sbApplyChange(p) {
  const removed = p.eventType === "DELETE";
  const row = removed ? p.old : p.new;
  if (!row || !row.id) return;
  if (p.table === "expenses") { if (removed) S.expenses = S.expenses.filter(x => x.id !== row.id); else upsert(S.expenses, fromRowE(row)); }
  else if (p.table === "subs") { if (removed) S.subs = S.subs.filter(x => x.id !== row.id); else upsert(S.subs, fromRowS(row)); }
  else if (p.table === "config" && !removed && row.id === "main" && row.data) S.config = { ...clone(DEFAULT_CONFIG), ...row.data };
  refresh();
}
function strip(o) { const { id, ...rest } = o; return rest; }
function upsert(arr, item) { const i = arr.findIndex(x => x.id === item.id); if (i >= 0) arr[i] = item; else arr.push(item); }

function failed(err) {
  const code = err && err.code;
  if (code === "invalid_argument" || code === "not_granted") { S.readOnly = true; toast("Nemaš dozvolu da menjaš ove podatke."); }
  else if (code === "quota_exceeded") toast("Baza je puna. Obriši stare troškove pa pokušaj ponovo.");
  else toast("Čuvanje nije uspelo. Pokušaj ponovo.");
  console.error(err);
}
async function retryOnce(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
    throw e;
  }
}
const store = {
  async putExpense(e) {
    if (DB) { try { await retryOnce(() => DB.collection("expenses").doc(e.id).set(strip(e))); } catch (err) { failed(err); return false; } }
    else if (SB) { try { await sbRun(SB.from("expenses").upsert(toRowE(e))); } catch (err) { sbFailed(err); return false; } upsert(S.expenses, e); refresh(); }
    else { upsert(S.expenses, e); localSave(); refresh(); }
    return true;
  },
  async delExpense(id) {
    if (DB) { try { await retryOnce(() => DB.collection("expenses").doc(id).delete()); } catch (err) { failed(err); return false; } }
    else if (SB) { try { await sbRun(SB.from("expenses").delete().eq("id", id)); } catch (err) { sbFailed(err); return false; } S.expenses = S.expenses.filter(x => x.id !== id); refresh(); }
    else { S.expenses = S.expenses.filter(x => x.id !== id); localSave(); refresh(); }
    return true;
  },
  async putSub(s) {
    if (DB) { try { await retryOnce(() => DB.collection("subs").doc(s.id).set(strip(s))); } catch (err) { failed(err); return false; } }
    else if (SB) { try { await sbRun(SB.from("subs").upsert(toRowS(s))); } catch (err) { sbFailed(err); return false; } upsert(S.subs, s); refresh(); }
    else { upsert(S.subs, s); localSave(); refresh(); }
    return true;
  },
  async delSub(id) {
    if (DB) { try { await retryOnce(() => DB.collection("subs").doc(id).delete()); } catch (err) { failed(err); return false; } }
    else if (SB) { try { await sbRun(SB.from("subs").delete().eq("id", id)); } catch (err) { sbFailed(err); return false; } S.subs = S.subs.filter(x => x.id !== id); refresh(); }
    else { S.subs = S.subs.filter(x => x.id !== id); localSave(); refresh(); }
    return true;
  },
  async saveConfig(cfg) {
    S.config = cfg;
    if (DB) { try { await retryOnce(() => DB.doc("meta/config").set(clone(cfg))); } catch (err) { failed(err); return false; } }
    else if (SB) { try { await sbRun(SB.from("config").upsert({ id: "main", data: clone(cfg) })); } catch (err) { sbFailed(err); return false; } }
    else { localSave(); }
    refresh();
    return true;
  },
  /* Many rows at once: example data and the one-time import from this browser */
  async putMany(expenses, subs) {
    if (SB) {
      try {
        if (expenses.length) await sbRun(SB.from("expenses").upsert(expenses.map(toRowE)));
        if (subs.length) await sbRun(SB.from("subs").upsert(subs.map(toRowS)));
      } catch (err) { sbFailed(err); return false; }
      expenses.forEach(e => upsert(S.expenses, e)); subs.forEach(s => upsert(S.subs, s));
    } else if (DB) {
      for (const e of expenses) if (!(await store.putExpense(e))) return false;
      for (const s of subs) if (!(await store.putSub(s))) return false;
      return true;
    } else {
      expenses.forEach(e => upsert(S.expenses, e)); subs.forEach(s => upsert(S.subs, s)); localSave();
    }
    refresh();
    return true;
  },
  async clearExamples() {
    if (SB) {
      try {
        await sbRun(SB.from("expenses").delete().eq("example", true));
        await sbRun(SB.from("subs").delete().eq("example", true));
      } catch (err) { sbFailed(err); return false; }
    } else if (DB) {
      for (const e of S.expenses.filter(x => x.example)) await store.delExpense(e.id);
      for (const s of S.subs.filter(x => x.example)) await store.delSub(s.id);
      return true;
    }
    S.expenses = S.expenses.filter(e => !e.example); S.subs = S.subs.filter(s => !s.example);
    if (!SB) localSave();
    refresh();
    return true;
  }
};

function snapToList(snap) { return snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() })); }

async function boot() {
  const hasClaude = typeof window.claude === "object" && window.claude && typeof window.claude.use === "function";
  if (hasClaude) {
    try { DB = await window.claude.use("db"); } catch (e) { DB = null; }
    try { DL = await window.claude.use("downloads"); } catch (e) { DL = null; }
  }
  if (DB) {
    S.mode = "db";
    let pending = 3;
    const ready = () => { if (pending > 0 && --pending === 0) renderTab(); else if (pending <= 0) refresh(); };
    const onErr = e => { console.error(e); if (e && e.code === "revoked") { S.readOnly = true; } toast("Veza sa bazom je prekinuta. Osveži stranicu."); };
    DB.collection("expenses").onSnapshot(snap => { S.expenses = snapToList(snap); ready(); }, onErr);
    DB.collection("subs").onSnapshot(snap => { S.subs = snapToList(snap); ready(); }, onErr);
    DB.doc("meta/config").onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); S.config = { ...clone(DEFAULT_CONFIG), ...clone(d) }; }
      ready();
    }, onErr);
  } else if (sbConfigured()) {
    SB = window.supabase.createClient(SBCFG.supabaseUrl, SBCFG.supabaseAnonKey, { auth: { persistSession: false } });
    try {
      await sbLoadAll();
    } catch (err) {
      console.error(err);
      SB = null;
      S.mode = "local";
      localLoad();
      renderTab();
      setMode();
      toast("Baza nije dostupna, prikazujem podatke iz ovog browsera. Proveri config.js i schema.sql.");
      return;
    }
    S.mode = "sb";
    // Data entered here before Supabase was set up can be moved into the database once
    const old = localRead();
    if (old) {
      const ids = new Set(S.expenses.map(e => e.id)), sids = new Set(S.subs.map(s => s.id));
      const ex = (old.expenses || []).filter(e => !ids.has(e.id)), sx = (old.subs || []).filter(s => !sids.has(s.id));
      if (ex.length || sx.length) S.pendingImport = { expenses: ex, subs: sx };
    }
    renderTab();
    SB.channel("troskovnik")
      .on("postgres_changes", { event: "*", schema: "public" }, sbApplyChange)
      .subscribe();
    // Backup for missed realtime events: reload when the tab comes back into view
    let lastSync = Date.now();
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState !== "visible" || Date.now() - lastSync < 15000) return;
      lastSync = Date.now();
      try { await sbLoadAll(); refresh(); } catch (err) { console.error(err); }
    });
  } else {
    S.mode = "local";
    localLoad();
    renderTab();
  }
  setMode();
}

function setMode() {
  const m = $("#mode");
  m.className = "mode " + S.mode;
  $("span", m).textContent = S.mode === "db" ? "Sačuvano u oblaku" : S.mode === "sb" ? "Sačuvano u bazi" : S.mode === "local" ? "Sačuvano u ovom browseru" : "";
  m.title = S.mode === "db" ? "Podaci se čuvaju uz ovaj artifact i vidiš ih sa svakog uređaja."
    : S.mode === "sb" ? "Podaci se čuvaju u Supabase bazi i vidiš ih sa svakog uređaja."
    : "Podaci se čuvaju samo u ovom browseru na ovom uređaju.";
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : "");
  if (action) $("button", t).onclick = () => { t.classList.remove("show"); action.fn(); };
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), action ? 6000 : 3000);
}

/* ---------- Tabs ---------- */
const VIEWS = {};
function renderTab() {
  if (!VIEWS[S.tab]) S.tab = "pregled";
  $$("#tabs .tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  // Fresh element per tab so listeners added by one tab's shell never leak into another
  const old = $("#view");
  const v = old.cloneNode(false);
  old.replaceWith(v);
  VIEWS[S.tab].shell(v);
  refresh();
}
function refresh() {
  if (S.mode === "loading") return;
  updateHeader();
  const v = VIEWS[S.tab];
  if (v && v.update) v.update($("#view"));
}
function updateHeader() {
  const t = today();
  const m = sum(S.expenses.filter(inRange(monthStart(t), monthEnd(t))));
  $("#hdr-sub").textContent = `${fmtMonth(t)} · ${money(m, { round: true })}`;
}
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  S.tab = b.dataset.tab;
  try { localStorage.setItem("troskovnik-tab", S.tab); } catch (err) {}
  renderTab();
  window.scrollTo({ top: 0 });
});
$("#add-btn").addEventListener("click", () => openExpense());
document.addEventListener("keydown", e => {
  if (e.key === "n" && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$("#dlg").open) { e.preventDefault(); openExpense(); }
});

/* ---------- Shared render bits ---------- */
function catChip(id) { const c = catById(id); return `<span class="chip"><i class="dot" style="background:${esc(c.color)}"></i>${esc(c.name)}</span>`; }
function barsHTML(rows, total, kind, prevMap) {
  if (!rows.length) return `<p style="color:var(--muted);margin:0">Nema troškova u ovom periodu.</p>`;
  const max = rows[0][1] || 1;
  return `<div class="bars">${rows.map(([id, v]) => {
    const meta = kind === "cat" ? catById(id) : { name: methodById(id).name, color: "var(--accent)" };
    const share = total ? Math.round(v / total * 100) : 0;
    let cmp = "";
    if (prevMap) {
      const p = prevMap.get(id) || 0;
      const d = v - p;
      const cls = Math.abs(d) < 1 ? "flat" : d > 0 ? "up" : "down";
      cmp = `<span class="cmp ${cls}" title="U odnosu na prethodni period">${d > 0 ? "+" : d < 0 ? "−" : "±"}${money(Math.abs(d), { round: true, bare: true })}</span>`;
    }
    return `<div class="bar-row">
      <div class="name"><i class="dot" style="background:${esc(meta.color)}"></i><span>${esc(meta.name)}</span> ${cmp}</div>
      <div class="amt">${money(v, { round: true })}<em>${share}%</em></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, v / max * 100)}%;background:${esc(meta.color)}"></div></div>
    </div>`;
  }).join("")}</div>`;
}
/* Axis max = 4 round steps, so every gridline lands on a readable number */
const isNarrow = () => window.innerWidth <= 640;
let wasNarrow = isNarrow();
window.addEventListener("resize", () => { if (isNarrow() !== wasNarrow) { wasNarrow = isNarrow(); refresh(); } });
function niceMax(v) {
  if (v <= 0) return 1000;
  const raw = v / 4;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p * 4;
  return 40 * p;
}
function shortMoney(v) {
  if (v >= 1e6) return NF.format(Math.round(v / 1e5) / 10) + "M";
  if (v >= 1000) return NF.format(Math.round(v / 100) / 10) + "k";
  return NF0.format(v);
}
/* Stacked (by category) or plain vertical bars. cols: [{label, total, parts:[[catId,val]], current, title}] */
function barChart(cols, opts = {}) {
  // A narrower drawing on phones keeps axis text close to its real pixel size
  const W = isNarrow() ? 330 : 640, H = (opts.h || 220) * (isNarrow() ? 0.82 : 1), padL = isNarrow() ? 34 : 40, padR = 6, padT = 22, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const max = niceMax(Math.max(...cols.map(c => c.total), 0));
  const y = v => padT + innerH - v / max * innerH;
  const slot = innerW / cols.length;
  const bw = Math.min(opts.maxBar || 46, slot * 0.62);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = max / 4 * i, yy = y(v);
    g += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"${i ? ' stroke-dasharray="2 4"' : ""}/>`;
    g += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end">${shortMoney(v)}</text>`;
  }
  const showEvery = opts.labelEvery || 1;
  cols.forEach((c, i) => {
    const x = padL + slot * i + (slot - bw) / 2;
    let acc = 0;
    const parts = c.parts && c.parts.length ? c.parts : [[null, c.total]];
    parts.forEach(([cid, v], j) => {
      if (v <= 0) return;
      const y0 = y(acc), y1 = y(acc + v);
      const color = cid ? catById(cid).color : (c.current ? "var(--accent)" : "color-mix(in srgb, var(--accent) 45%, var(--surface-2))");
      const top = j === parts.length - 1 || parts.slice(j + 1).every(p => p[1] <= 0);
      const h = Math.max(0.5, y0 - y1);
      g += `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${color}" rx="${top ? 4 : 0}"${c.current || !opts.dimPast ? "" : ' opacity=".55"'}><title>${esc(c.title || c.label)}${cid ? " · " + esc(catById(cid).name) : ""}: ${money(v, { round: true })}</title></rect>`;
      if (top && h > 4) g += `<rect x="${x}" y="${y1 + 4}" width="${bw}" height="${Math.min(h - 4, 4)}" fill="${color}"${c.current || !opts.dimPast ? "" : ' opacity=".55"'}/>`;
      acc += v;
    });
    if (c.total > 0 && opts.totals !== false) g += `<text class="${c.current ? "cur" : "total"}" x="${x + bw / 2}" y="${y(c.total) - 6}" text-anchor="middle">${shortMoney(c.total)}</text>`;
    if (i % showEvery === 0 || c.current) g += `<text class="${c.current ? "cur" : ""}" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(c.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "Grafikon troškova")}">${g}</svg>`;
}

async function paySub(s, silent) {

const PERIODS = [
  ["all", "Sve vreme"], ["week", "Ova nedelja"], ["lastweek", "Prošla nedelja"], ["month", "Ovaj mesec"],
  ["lastmonth", "Prošli mesec"], ["30", "Poslednjih 30 dana"], ["year", "Ova godina"], ["custom", "Izaberi datume"]
];
function periodRange(p) {
  const t = today();
  switch (p) {
    case "week": return [weekStart(t), addDays(weekStart(t), 6)];
    case "lastweek": return [addDays(weekStart(t), -7), addDays(weekStart(t), -1)];
    case "month": return [monthStart(t), monthEnd(t)];
    case "lastmonth": { const s = addMonths(monthStart(t), -1); return [s, monthEnd(s)]; }
    case "30": return [addDays(t, -29), t];
    case "year": return [t.slice(0, 4) + "-01-01", t.slice(0, 4) + "-12-31"];
    case "custom": return [S.filters.from || "0000-01-01", S.filters.to || "9999-12-31"];
    default: return ["0000-01-01", "9999-12-31"];
  }
}
const SORTS = [["date", "desc", "Najnovije prvo"], ["date", "asc", "Najstarije prvo"], ["amount", "desc", "Najskuplje prvo"], ["amount", "asc", "Najjeftinije prvo"], ["title", "asc", "Opis A–Ž"], ["category", "asc", "Kategorija"], ["method", "asc", "Način plaćanja"]];
function filtered() {
  const f = S.filters;
  const [from, to] = periodRange(f.period);
  const q = f.q.trim().toLowerCase();
  const min = f.min === "" ? -Infinity : Number(f.min), max = f.max === "" ? Infinity : Number(f.max);
  let list = S.expenses.filter(e => e.date >= from && e.date <= to
    && (!f.cat || e.category === f.cat) && (!f.method || e.method === f.method)
    && e.amount >= min && e.amount <= max
    && (!q || (e.title || "").toLowerCase().includes(q) || (e.note || "").toLowerCase().includes(q) || catById(e.category).name.toLowerCase().includes(q)));
  const { key, dir } = S.sort, m = dir === "asc" ? 1 : -1;
  const coll = new Intl.Collator("sr-Latn");
  list.sort((a, b) => {
    let r = 0;
    if (key === "amount") r = a.amount - b.amount;
    else if (key === "title") r = coll.compare(a.title || "", b.title || "");
    else if (key === "category") r = coll.compare(catById(a.category).name, catById(b.category).name);
    else if (key === "method") r = coll.compare(methodById(a.method).name, methodById(b.method).name);
    else r = a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0);
    return r * m || byDateDesc(a, b);
  });
  return list;
}

async function exportCSV() {
  const list = filtered();
  if (!list.length) { toast("Nema troškova za izvoz."); return; }
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [["Datum", "Opis", "Kategorija", "Način plaćanja", "Iznos", "Valuta", "Napomena"].map(q).join(";")];
  for (const e of list) lines.push([e.date, e.title, catById(e.category).name, methodById(e.method).name, String(e.amount).replace(".", ","), S.config.currency, e.note].map(q).join(";"));
  const data = "﻿" + lines.join("\r\n");
  const filename = `troskovi-${today()}.csv`;
  if (DL) {
    try { await DL.save({ filename, data }); toast("CSV je sačuvan."); }
    catch (err) { if (err && err.code !== "declined") toast("Izvoz nije uspeo ovde."); }
    return;
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "text/csv" }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  } catch (err) { toast("Izvoz nije uspeo ovde."); }
}

/* ---------- View: Recap ---------- */
function recapRange(type, offset) {
  const t = today();
  if (type === "week") { const s = addDays(weekStart(t), offset * 7); return [s, addDays(s, 6)]; }
  const s = addMonths(monthStart(t), offset); return [s, monthEnd(s)];
}
function recapLabel(type, from, to) {
  if (type === "week") return `Nedelja ${isoWeek(from)} · ${fmtDay(from)} – ${fmtDay(to)} ${to.slice(0, 4)}`;
  return fmtMonth(from);
}

      else { const nm = el.value.trim(); if (!nm) { el.value = item.name; return; } item.name = nm; }
      store.saveConfig(c);
    });
    v.addEventListener("click", e => {
      const b = e.target.closest("[data-del]"); if (!b) return;
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Potvrdi"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Obriši"; } }, 4000); return; }
      const row = b.closest("[data-cfg]"); const c = cfg();
      c[row.dataset.cfg] = c[row.dataset.cfg].filter(x => x.id !== row.dataset.id);
      store.saveConfig(c);
    });
  },
  update(v) {
    if (!$("#st-cats", v)) return;
    if (v.contains(document.activeElement) && document.activeElement.closest("[data-cfg]")) return;
    const used = k => { const m = new Map(); S.expenses.forEach(e => m.set(e[k], (m.get(e[k]) || 0) + 1)); return m; };
    const uc = used("category"), um = used("method");
    $("#st-cats", v).innerHTML = S.config.categories.map(c => `<div class="set-item" data-cfg="categories" data-id="${esc(c.id)}">
      <input type="color" value="${esc(c.color)}" aria-label="Boja za ${esc(c.name)}">
      <input class="input" value="${esc(c.name)}" maxlength="40" aria-label="Naziv kategorije">
      <span class="count">${uc.get(c.id) || 0}×</span>
      <button class="btn sm ghost danger" type="button" data-del>Obriši</button></div>`).join("");
    $("#st-methods", v).innerHTML = S.config.methods.map(m => `<div class="set-item no-color" data-cfg="methods" data-id="${esc(m.id)}">
      <input class="input" value="${esc(m.name)}" maxlength="40" aria-label="Naziv načina plaćanja">
      <span class="count">${um.get(m.id) || 0}×</span>
      <button class="btn sm ghost danger" type="button" data-del>Obriši</button></div>`).join("");
    const cur = $("#st-cur", v); if (document.activeElement !== cur) cur.value = S.config.currency;
    const counts = `Ukupno: ${S.expenses.length} troškova, ${S.subs.length} pretplata.`;
    $("#st-where", v).textContent = S.mode === "db" ? `Troškovi se čuvaju uz ovu stranicu i vidiš ih sa svakog uređaja. ${counts}`
      : S.mode === "sb" ? `Troškovi se čuvaju u Supabase bazi i vidiš ih sa svakog uređaja. ${counts}`
      : `Troškovi se čuvaju samo u ovom browseru. Za čuvanje u bazi upiši Supabase podatke u config.js. ${counts}`;
  }
};

/* ---------- Dialogs ---------- */
const dlg = $("#dlg");
function openDialog(html, onMount) {
  dlg.innerHTML = html;
  try { dlg.showModal(); } catch (e) { dlg.setAttribute("open", ""); }
  onMount && onMount(dlg);
}
function closeDialog() { try { dlg.close(); } catch (e) { dlg.removeAttribute("open"); } }
dlg.addEventListener("click", e => { if (e.target === dlg) closeDialog(); });

function pickHTML(name, list, val, withDot) {
  return `<div class="pick" data-pick="${name}">${list.map(o => `<button type="button" data-v="${esc(o.id)}" aria-pressed="${o.id === val}">${withDot ? `<i class="dot" style="background:${esc(o.color)}"></i>` : ""}${esc(o.name)}</button>`).join("")}</div>`;
}
function wirePick(root) {
  $$("[data-pick]", root).forEach(p => p.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $$("button", p).forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
}
const picked = (root, name) => { const b = $(`[data-pick="${name}"] [aria-pressed="true"]`, root); return b ? b.dataset.v : ""; };
function lastUsed(key, fallback) {
  const s = [...S.expenses].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0];
  return (s && s[key]) || fallback;
}
function parseAmount(s) { const v = Number(String(s).replace(/\s/g, "").replace(",", ".")); return isFinite(v) ? v : NaN; }

function openExpense(e) {
  if (S.readOnly) { toast("Nemaš dozvolu da menjaš ove podatke."); return; }
  if (S.mode === "loading") return;
  const isNew = !e;
  const x = e || { date: today(), category: "", method: lastUsed("method", S.config.methods[0] && S.config.methods[0].id) };
  openDialog(`<form class="dlg" id="ex-form" novalidate>
    <h2>${isNew ? "Novi trošak" : "Izmeni trošak"}</h2>
    <label class="field"><span>Iznos (${esc(S.config.currency)})</span><input class="input amount-input" id="ex-amount" inputmode="decimal" autocomplete="off" placeholder="0" value="${x.amount != null ? esc(String(x.amount).replace(".", ",")) : ""}"></label>
    <label class="field"><span>Opis</span><input class="input" id="ex-title" maxlength="80" placeholder="npr. Termin za mali fudbal" value="${esc(x.title || "")}"></label>
    <div class="field"><span>Kategorija</span>${pickHTML("cat", S.config.categories, x.category, true)}</div>
    <div class="field"><span>Čime je plaćeno</span>${pickHTML("method", S.config.methods, x.method)}</div>
    <div class="two">
      <label class="field"><span>Datum</span><input class="input" id="ex-date" type="date" value="${esc(x.date)}"></label>
      <label class="field"><span>Napomena</span><input class="input" id="ex-note" maxlength="140" placeholder="opciono" value="${esc(x.note || "")}"></label>
    </div>
    <div class="err" id="ex-err"></div>
    <div class="foot">
      ${isNew ? "" : `<button class="btn danger left" type="button" id="ex-del">Obriši</button>`}
      <button class="btn ghost" type="button" id="ex-cancel">Otkaži</button>
      <button class="btn primary" type="submit">${isNew ? "Dodaj trošak" : "Sačuvaj"}</button>
    </div>
  </form>`, root => {
    wirePick(root);
    setTimeout(() => $("#ex-amount", root).focus(), 30);
    $("#ex-cancel", root).onclick = closeDialog;
    const del = $("#ex-del", root);
    if (del) del.onclick = async () => {
      if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Potvrdi brisanje"; return; }
      closeDialog();
      const ok = await store.delExpense(e.id);
      if (ok) toast("Trošak je obrisan.", { label: "Vrati", fn: () => store.putExpense(e) });
    };
    $("#ex-form", root).addEventListener("submit", async ev => {
      ev.preventDefault();
      const amount = parseAmount($("#ex-amount", root).value);
      const category = picked(root, "cat");
      const err = $("#ex-err", root);
      if (!(amount > 0)) { err.textContent = "Upiši iznos veći od nule."; $("#ex-amount", root).focus(); return; }
      if (!category) { err.textContent = "Izaberi kategoriju."; return; }
      const date = $("#ex-date", root).value || today();
      const rec = { ...(e || {}), id: e ? e.id : uid(), amount: Math.round(amount * 100) / 100, title: $("#ex-title", root).value.trim(), category, method: picked(root, "method"), date, note: $("#ex-note", root).value.trim(), createdAt: e && e.createdAt ? e.createdAt : Date.now() };
      if (!rec.subId) delete rec.subId;
      closeDialog();
      const ok = await store.putExpense(rec);
      if (ok) toast(isNew ? `Dodato: ${money(rec.amount, { round: true })} · ${catById(category).name}` : "Izmene su sačuvane.");
    });
  });
}

function openSub(s) {
  if (S.readOnly) { toast("Nemaš dozvolu da menjaš ove podatke."); return; }
  const isNew = !s;
  const x = s || { cycle: "mesecno", category: "pretplate", nextDate: today(), active: true, method: S.config.methods[1] ? S.config.methods[1].id : "" };
  openDialog(`<form class="dlg" id="sb-form" novalidate>
    <h2>${isNew ? "Nova pretplata" : "Izmeni pretplatu"}</h2>
    <label class="field"><span>Naziv</span><input class="input" id="sb-name" maxlength="60" placeholder="npr. Spotify, teretana, članarina" value="${esc(x.name || "")}"></label>
    <div class="two">
      <label class="field"><span>Iznos (${esc(S.config.currency)})</span><input class="input" id="sb-amount" inputmode="decimal" placeholder="0" value="${x.amount != null ? esc(String(x.amount).replace(".", ",")) : ""}"></label>
      <label class="field"><span>Naplaćuje se</span><select class="input" id="sb-cycle">${Object.entries(CYCLES).map(([k, l]) => `<option value="${k}"${k === x.cycle ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    </div>
    <label class="field"><span>Sledeća naplata</span><input class="input" id="sb-next" type="date" value="${esc(x.nextDate || "")}"></label>
    <div class="field"><span>Kategorija</span>${pickHTML("cat", S.config.categories, x.category, true)}</div>
    <div class="field"><span>Čime se plaća</span>${pickHTML("method", S.config.methods, x.method)}</div>
    <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="sb-active"${x.active !== false ? " checked" : ""}> Aktivna</label>
    <div class="err" id="sb-err"></div>
    <div class="foot">
      ${isNew ? "" : `<button class="btn danger left" type="button" id="sb-del">Obriši</button>`}
      <button class="btn ghost" type="button" id="sb-cancel">Otkaži</button>
      <button class="btn primary" type="submit">${isNew ? "Dodaj pretplatu" : "Sačuvaj"}</button>
    </div>
  </form>`, root => {
    wirePick(root);
    setTimeout(() => $("#sb-name", root).focus(), 30);
    $("#sb-cancel", root).onclick = closeDialog;
    const del = $("#sb-del", root);
    if (del) del.onclick = async () => {
      if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Potvrdi brisanje"; return; }
      closeDialog();
      const ok = await store.delSub(s.id);
      if (ok) toast("Pretplata je obrisana. Zabeleženi troškovi ostaju.", { label: "Vrati", fn: () => store.putSub(s) });
    };
    $("#sb-form", root).addEventListener("submit", async ev => {
      ev.preventDefault();
      const name = $("#sb-name", root).value.trim();
      const amount = parseAmount($("#sb-amount", root).value);
      const err = $("#sb-err", root);
      if (!name) { err.textContent = "Upiši naziv pretplate."; return; }
      if (!(amount > 0)) { err.textContent = "Upiši iznos veći od nule."; return; }
      const rec = { ...(s || {}), id: s ? s.id : uid(), name, amount: Math.round(amount * 100) / 100, cycle: $("#sb-cycle", root).value, nextDate: $("#sb-next", root).value || today(), category: picked(root, "cat") || "pretplate", method: picked(root, "method"), active: $("#sb-active", root).checked, createdAt: s && s.createdAt ? s.createdAt : Date.now() };
      closeDialog();
      const ok = await store.putSub(rec);
      if (ok) toast(isNew ? `Pretplata ${name} je dodata.` : "Izmene su sačuvane.");
    });
  });
}
